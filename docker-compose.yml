# PostgreSQL for walks, occurrences and AI results. Photos stay on disk (PHOTOS_DIR).
# Start: docker compose up -d   ·   Credentials come from .env (see .env.example).
services:
  postgres:
    image: postgres:18-alpine
    container_name: bairro_acao_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bairro_acao}
      POSTGRES_USER: ${POSTGRES_USER:-bairro_acao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - bairro_acao_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bairro_acao_pgdata:
